name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which parts of the repo exist, so backend/frontend jobs switch on
  # automatically as soon as that code lands, with no workflow edits needed.
  detect:
    name: Detect project parts
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      frontend: ${{ steps.parts.outputs.frontend }}
      compose: ${{ steps.parts.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - id: parts
        run: |
          [ -f backend/pyproject.toml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          [ -f infra/compose/docker-compose.yml ] && echo "compose=true" >> "$GITHUB_OUTPUT" || echo "compose=false" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs (Mermaid + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json
      - run: npm ci
        working-directory: .github/scripts
      - name: Validate Mermaid diagrams
        run: node .github/scripts/check-mermaid.mjs $(git ls-files '*.md')
      - name: Check relative links
        run: node .github/scripts/check-links.mjs $(git ls-files '*.md')

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1

  backend:
    name: Backend (lint, types, tests)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad
          POSTGRES_DB: sanad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sanad" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sanad:sanad@localhost:5432/sanad_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Module boundaries
        if: hashFiles('backend/.importlinter') != ''
        run: lint-imports
      - name: Migrations apply cleanly
        if: hashFiles('backend/alembic.ini') != ''
        run: alembic upgrade head
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit

  frontend:
    name: Frontend (lint, types, tests, build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    name: Docker Compose config
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml config --quiet
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.prod.yml config --quiet
