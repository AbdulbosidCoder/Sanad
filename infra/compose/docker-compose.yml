# Base services. Combine with docker-compose.dev.yml or docker-compose.prod.yml
# (see Makefile). Every service has a healthcheck: `make ps` shows which one is unhealthy.
name: sanad

x-backend: &backend
  build:
    context: ../../backend
  env_file: ../../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  networks: [app, data]

services:
  postgres:
    image: postgres:16
    env_file: ../../.env
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ../../.env
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  # One-shot: applies database migrations, then exits. The API waits for it.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]
    healthcheck:
      disable: true
    depends_on:
      redis: {condition: service_healthy}

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${HTTP_PORT:-80}:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api: {condition: service_healthy}
    networks: [public, app]

networks:
  public: {}
  app: {internal: true}
  data: {internal: true}

volumes:
  pg_data: {}
  redis_data: {}
  minio_data: {}
