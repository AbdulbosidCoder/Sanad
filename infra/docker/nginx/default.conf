# Reverse proxy: one entry point for the API and the three frontend apps.
server {
    listen 80;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 200 "ok\n"; }

    location ~ ^/(api|health)/ {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
        # Keep the browser's request id when it sends one, otherwise nginx makes one.
        set $rid $http_x_request_id;
        if ($rid = "") { set $rid $request_id; }
        proxy_set_header X-Request-Id $rid;
    }

    location /seller { proxy_pass http://seller:3001; include /etc/nginx/conf.d/proxy_headers.inc; }
    location /admin  { proxy_pass http://admin:3002;  include /etc/nginx/conf.d/proxy_headers.inc; }
    location /       { proxy_pass http://web:3000;    include /etc/nginx/conf.d/proxy_headers.inc; }
}
